<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | Sabor Criollo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/Carrito.css">
</head>

<body>

    <!-- Navegación -->
    <nav class="barra-navegacion">

        <a href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> Inicio
        </a>

        <a href="Catalogo.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg> Catálogo
        </a>

        <a href="Carrito.html" class="activo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg> Carrito
            <span id="contador-nav">0</span>
        </a>

    </nav>


    <!-- Encabezado -->
    <header class="encabezado-carrito">

        <h1>Tu carrito</h1>

        <p>
            Revisa tu pedido antes de realizarlo.
        </p>

    </header>


    <main>

        <!-- Productos del carrito -->
        <section class="carrito-contenedor">

            <div id="lista-carrito"></div>

        </section>


        <!-- Resumen -->
        <section class="resumen-carrito">

            <h2>Resumen del pedido</h2>

            <div class="total">

                <span>Total:</span>

                <strong id="total-carrito">
                    $0
                </strong>

            </div>

            <button id="boton-whatsapp" class="boton">
                Ordenar por WhatsApp
            </button>

        </section>

    </main>


    <footer>

        <p class="footer-marca">Sabor Criollo</p>

        <p>© 2026 Sabor Criollo — Comida casera hecha con cariño</p>

    </footer>


    <script src="js/Carrito.js"></script>

</body>

</html>
